version: 1

include:
  - "**/*.md"
  - "**/*.py"
  - "**/*.txt"
  - "**/*.yml"
  - "**/*.yaml"

exclude:
  - "exodia.yml"
  - "samples/**"
  - ".venv/**"
  - "venv/**"
  - "dist/**"
  - "build/**"

rules:
  em-dash:
    enabled: true
    replacement: " - "

  en-dash:
    enabled: true
    replacement: "-"

  horizontal-bar:
    enabled: true
    replacement: "-"

  minus-sign:
    enabled: true
    replacement: "-"

  ellipsis:
    enabled: true
    replacement: "..."

  smart-double-quotes:
    enabled: true

  smart-single-quotes:
    enabled: true

  nbsp:
    enabled: true
    replacement: " "

  zero-width:
    enabled: true
    replacement: ""

  emoji:
    enabled: true
    replacement: ""

  collapse-space:
    enabled: false

custom:
  - id: no-ai-phrase
    pattern: 'delve\s+into'
    replacement: "look at"
    enabled: true

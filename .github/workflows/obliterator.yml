name: obliterator

on: [push, pull_request]

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install
        run: python -m pip install -e .

      - name: Check Python and JavaScript
        run: semgrep scan --config semgrep/ai-artifacts.yml --error --metrics=off .

      - name: Sample fix pipeline
        run: python samples/pipeline.py

rules:
  - id: em-dash
    languages: [generic]
    severity: ERROR
    message: Replace the em dash with a spaced hyphen.
    paths: &targets
      include:
        - "*.py"
        - "*.pyi"
        - "*.js"
        - "*.jsx"
        - "*.mjs"
        - "*.cjs"
        - "*.ts"
        - "*.tsx"
        - "*.mts"
        - "*.cts"
        - "*.tf"
        - "*.tfvars"
        - "*.hcl"
      exclude:
        - "/samples/before.py"
        - "/samples/before.js"
        - "/samples/before.ts"
        - "/samples/before.tf"
        - "/samples/phrases.py"
    pattern-regex: '\x{2014}'
    fix: "\u2060 - \u2060"

  - id: en-dash
    languages: [generic]
    severity: ERROR
    message: Replace the en dash.
    paths: *targets
    pattern-regex: '\x{2013}'
    fix: "-"

  - id: horizontal-bar
    languages: [generic]
    severity: ERROR
    message: Replace the horizontal bar.
    paths: *targets
    pattern-regex: '\x{2015}'
    fix: "-"

  - id: minus-sign
    languages: [generic]
    severity: ERROR
    message: Replace the minus sign.
    paths: *targets
    pattern-regex: '\x{2212}'
    fix: "-"

  - id: ellipsis
    languages: [generic]
    severity: ERROR
    message: Replace the ellipsis.
    paths: *targets
    pattern-regex: '\x{2026}'
    fix: "..."

  - id: smart-double-quotes
    languages: [generic]
    severity: ERROR
    message: Replace smart double quotes.
    paths: *targets
    pattern-regex: '[\x{201C}\x{201D}]'
    fix: '"'

  - id: smart-single-quotes
    languages: [generic]
    severity: ERROR
    message: Replace smart single quotes.
    paths: *targets
    pattern-regex: '[\x{2018}\x{2019}]'
    fix: "'"

  - id: nbsp
    languages: [generic]
    severity: ERROR
    message: Replace the non-breaking space.
    paths: *targets
    pattern-regex: '\x{00A0}'
    fix: "\u2060 \u2060"

  - id: zero-width
    languages: [generic]
    severity: ERROR
    message: Remove zero-width characters.
    paths: *targets
    pattern-regex: '[\x{200B}\x{200C}\x{200D}\x{FEFF}]'
    fix: ""

  - id: emoji
    languages: [generic]
    severity: ERROR
    message: Remove emoji.
    paths: *targets
    pattern-regex: '(?:[#*0-9]\x{FE0F}?\x{20E3}|[\x{1F1E6}-\x{1F1FF}]{2}|(?:[\x{2600}-\x{26FF}\x{2700}-\x{27BF}\x{2B50}\x{2B55}\x{1F300}-\x{1F5FF}\x{1F600}-\x{1F64F}\x{1F680}-\x{1F6FF}\x{1F900}-\x{1FAFF}]\x{FE0F}?[\x{1F3FB}-\x{1F3FF}]?(?:\x{200D}[\x{2600}-\x{26FF}\x{2700}-\x{27BF}\x{2B50}\x{2B55}\x{1F300}-\x{1F5FF}\x{1F600}-\x{1F64F}\x{1F680}-\x{1F6FF}\x{1F900}-\x{1FAFF}]\x{FE0F}?[\x{1F3FB}-\x{1F3FF}]?)*))'
    fix: ""

  - id: no-ai-phrase
    languages: [generic]
    severity: ERROR
    message: Replace "delve into" with "look at".
    paths: *targets
    pattern-regex: '(?i)\bdelve\s+into\b'
    fix: "look at"

  - id: ai-phrase
    languages: [generic]
    severity: ERROR
    message: This AI writing phrase is not allowed.
    paths: *targets
    pattern-regex: '(?ix)\b(?:
      in\s+today(?:''|\x{2019})s\s+fast-paced\s+world
      | navigate\s+the\s+complexities
      | navigating\s+the\s+landscape
      | plays\s+a\s+pivotal\s+role
      | at\s+the\s+forefront\s+of
      | state-of-the-art
      | a\s+testament\s+to
      | paradigm\s+shift
      | groundbreaking
      | transformative
      | revolutionary
      | unprecedented
      | rich\s+tapestry
      | ever-evolving
      | unparalleled
      | cutting-edge
      | game-changer
      | multifaceted
      | testament\s+to
      | a\s+beacon\s+of
      | seamlessly
      | tapestry
      | seamless
      | holistic
      | pivotal
      | delve(?!\s+into\b)
      )\b'

  - id: ai-wording
    languages: [generic]
    severity: WARNING
    message: This wording is a common AI artifact.
    paths: *targets
    pattern-regex: '(?isx)(?:
      \bit(?:''|\x{2019})s\s+important\s+to\s+note\s+that\b
      | \bit\s+is\s+important\s+to\s+note\s+that\b
      | \bit(?:''|\x{2019})s\s+worth\s+noting\s+that\b
      | \bit\s+is\s+worth\s+noting\s+that\b
      | \bit(?:''|\x{2019})s\s+worth\s+considering\b
      | \bit\s+is\s+worth\s+considering\b
      | \btaking\s+this\s+a\s+step\s+further\b
      | \bone\s+of\s+the\s+most\s+important\b
      | \bthere\s+are\s+several\s+factors\b
      | \bthere\s+are\s+a\s+number\s+of\b
      | \bat\s+the\s+end\s+of\s+the\s+day\b
      | \ba\s+key\s+consideration\s+is\b
      | \bon\s+the\s+other\s+hand\b
      | \bon\s+the\s+one\s+hand\b
      | \bwith\s+that\s+in\s+mind\b
      | \bthat\s+being\s+said\b
      | \bin\s+the\s+ever-evolving\b
      | \bwhen\s+it\s+comes\s+to\b
      | \bbuilding\s+on\s+this\b
      | \bthis\s+underscores\b
      | \bthis\s+demonstrates\b
      | \bthis\s+highlights\b
      | \bthis\s+serves\s+as\b
      | \bas\s+we\s+navigate\b
      | \bin\s+conclusion\b
      | \bnot\s+only\b.{1,80}?\bbut\s+also\b
      | \bin\s+today(?:''|\x{2019})s\b(?!\s+fast-paced\s+world\b)
      | \boverall,
      | \bultimately,
      | \bfurthermore,
      | \bmoreover,
      | \badditionally,
      | (?<!navigating\sthe\s)\blandscape\b
      | \bcomprehensive\b
      | \bunderscores\b
      | \bintricacies\b
      | \bcornerstone\b
      | \bexceptional\b
      | \bleveraging\b
      | \bunderscore\b
      | \bmeticulous\b
      | \bnoteworthy\b
      | \btrajectory\b
      | \bstreamline\b
      | \bactionable\b
      | \binnovative\b
      | \bfacilitate\b
      | \bremarkable\b
      | \bintricate\b
      | \binterplay\b
      | \bzeitgeist\b
      | \bimpactful\b
      | \bparamount\b
      | \bspearhead\b
      | \bleverage\b
      | \bplethora\b
      | \bshowcase\b
      | \benduring\b
      | \bhallmark\b
      | \bpinnacle\b
      | \bfrontier\b
      | \bscalable\b
      | \bcommence\b
      | \bendeavor\b
      | \bprofound\b
      | \brenowned\b
      | \bcatalyze\b
      | \bchampion\b
      | \belevate\b
      | \bunleash\b
      | \bjourney\b
      | \benhance\b
      | \bharness\b
      | \bsynergy\b
      | \bempower\b
      | \bnuanced\b
      | \bdynamic\b
      | \butilize\b
      | \bamplify\b
      | \brobust\b
      | \bfoster\b
      | \bgarner\b
      | \bmyriad\b
      | \bunlock\b
      | \bembark\b
      | \bpropel\b
      | \brealm\b
      | \bnexus\b
      )'

  - id: fix-padding
    languages: [generic]
    severity: ERROR
    message: Remove U+2060 word joiners used so spaced replacements survive autofix.
    paths: *targets
    pattern-regex: '\x{2060}'
    fix: ""

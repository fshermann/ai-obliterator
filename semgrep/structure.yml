rules:
  - id: nested-block
    languages: [python]
    severity: ERROR
    message: Do not nest if, for, while, with, or try. The function body is level 0.
    paths: &python_paths
      include:
        - "*.py"
        - "*.pyi"
      exclude: &style_excludes
        - "/samples/before.py"
        - "/samples/before.js"
        - "/samples/before.ts"
        - "/samples/before.tf"
        - "/samples/before.cpp"
        - "/samples/phrases.py"
        - "/samples/comments.py"
        - "/samples/comments.js"
        - "/samples/comments.ts"
        - "/samples/comments.tf"
        - "/samples/comments.cpp"
        - "/samples/style.py"
        - "/samples/long_file.py"
    patterns:
      - pattern-either:
          - pattern: |
              if ...:
                ...
                if ...:
                  ...
          - pattern: |
              for $OUTER in ...:
                ...
                if ...:
                  ...
          - pattern: |
              while ...:
                ...
                if ...:
                  ...
          - pattern: |
              with ...:
                ...
                if ...:
                  ...
          - pattern: |
